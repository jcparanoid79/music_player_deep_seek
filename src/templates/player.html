<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Music Player</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container glass">
      <!-- Sidebar -->
      <div class="file-panel glass">
        <h2><i class="fas fa-music"></i> Library</h2>
        <input
          type="file"
          id="file-upload"
          accept="audio/*"
          multiple
          webkitdirectory
          directory
          style="display: none"
        />
        <button id="upload-btn" class="btn">
          <i class="fas fa-upload"></i> Add Music
        </button>
        <button id="scan-btn" class="btn">
          <i class="fas fa-folder-open"></i> Scan Folder
        </button>
      </div>

      <!-- Main Player -->
      <div class="player-container glass">
        <!-- Track Info -->
        <div class="metadata-display animate">
          <img
            id="album-art"
            class="album-art"
            src="{{ url_for('static', filename='img/default-album.png') }}"
            alt="Album Art"
          />
          <div class="track-info">
            <h2 id="track-title">No Track Selected</h2>
            <p id="track-artist"></p>
            <p id="track-album"></p>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button id="shuffle" class="control-btn">
            <i class="fas fa-random"></i>
          </button>
          <button id="prev" class="control-btn">
            <i class="fas fa-step-backward"></i>
          </button>
          <button id="play" class="control-btn play-pause">
            <i class="fas fa-play"></i>
          </button>
          <button id="next" class="control-btn">
            <i class="fas fa-step-forward"></i>
          </button>
          <button id="repeat" class="control-btn">
            <i class="fas fa-redo"></i>
          </button>
          <div class="volume-control">
            <i class="fas fa-volume-up control-btn"></i>
            <input type="range" id="volume" min="0" max="100" value="80" />
          </div>
        </div>

        <!-- Visualization -->
        <div class="visualization-container">
          <canvas id="waveform"></canvas>
        </div>

        <!-- Lyrics -->
        <div class="lyrics-panel glass">
          <h3><i class="fas fa-align-left"></i> Lyrics</h3>
          <div id="lyrics-content" class="lyrics-content"></div>
        </div>
      </div>

      <!-- Playlist -->
      <div class="playlist-panel glass">
        <h2><i class="fas fa-list"></i> Playlist</h2>
        <button id="clear-playlist" class="btn">
          <i class="fas fa-trash"></i> Clear
        </button>
        <div id="playlist"></div>
      </div>
    </div>

    <audio id="audio-player"></audio>

    <script src="{{ url_for('static', filename='js/player.js') }}"></script>
    <script src="{{ url_for('static', filename='js/usb_handler.js') }}"></script>
  </body>
</html>
